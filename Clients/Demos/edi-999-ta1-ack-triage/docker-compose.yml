services:
  webui:
    profiles: ["stage", "full"]
    build:
      context: ./webui
    image: pilotfish-edi-999-ta1-ack-triage-webui:latest
    container_name: pf-edi-999-ta1-ack-tria-webui
    restart: unless-stopped
    environment:
      WEBUI_PORT: "8129"
      ROUTES_DIR: /routes
      DOCUMENTS_DIR: /documents
      SAMPLE_DIR: /samples
      INBOUND_DIR: /inbound
      ACCEPTED_DIR: /output/accepted
      REJECTED_DIR: /output/rejected
      ERROR_DIR: /output/error
      REPORTS_DIR: /output/reports
      ARCHIVE_DIR: /output/archive
      LAN_HINT: "http://192.168.68.62:8129/"
      EIP_PUBLIC_URL: "http://localhost:8128/eip/"
    ports:
      - "8129:8129"
    volumes:
      - ./documents:/documents:ro
      - ./samples:/samples:ro
      - ./input:/inbound
      - ./output:/output
      # Prefer demo-eip-root (no spaces). Paths with spaces often mount empty on Docker Desktop.
      - ./pilotfish/demo-eip-root/routes:/routes:ro
      - ./webui/static:/app/static:ro
      - ./webui/templates:/app/templates:ro
      - ./webui/app.py:/app/app.py:ro
      - ./webui/document_routes.py:/app/document_routes.py:ro

  # Add pilotfish (+ deps) under profile "full" when runtime is ready.
  # pilotfish:
  #   profiles: ["full"]
  #   ...
