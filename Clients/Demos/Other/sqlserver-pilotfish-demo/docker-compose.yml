services:
  sqlserver:
    profiles: ["full"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pf-sqlserver-pilotfish-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "PilotFish_Demo1!"
      MSSQL_PID: Developer
    ports:
      - "14342:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"PilotFish_Demo1!\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s

  sqlserver-init:
    profiles: ["full"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pf-sqlserver-pilotfish-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./sql:/sql:ro
    entrypoint:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail
        echo "Initializing PilotFishDemo..."
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'PilotFish_Demo1!' -C -i /sql/01_init.sql
        echo "SQL seed complete."

  pilotfish:
    profiles: ["full"]
    build:
      context: ./pilotfish
    image: pilotfish-sqlserver-pilotfish-demo:23R1
    container_name: pf-sqlserver-pilotfish-pilotfish
    restart: unless-stopped
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      CATALINA_OPTS: "-Xms256M -Xmx1024M -server -XX:+UseG1GC"
      JAVA_OPTS: "-Djava.security.egd=file:///dev/urandom"
    ports:
      - "8136:8080"
    volumes:
      - ./input:/opt/pilotfish/input
      - ./output:/opt/pilotfish/output
      - ./logs:/usr/local/tomcat/webapps/eip/logs
      - ./pilotfish/demo-eip-root/routes:/usr/local/tomcat/webapps/eip/eip-root/routes
      - ./pilotfish/demo-eip-root/environment-settings.conf:/usr/local/tomcat/webapps/eip/eip-root/environment-settings.conf:ro

  webui:
    profiles: ["stage", "full"]
    build:
      context: ./webui
    image: pilotfish-sqlserver-pilotfish-demo-webui:latest
    container_name: pf-sqlserver-pilotfish-webui
    restart: unless-stopped
    environment:
      WEBUI_PORT: "8137"
      DEMO_SLUG: "sqlserver-pilotfish-demo"
      ROUTES_DIR: /routes
      DOCUMENTS_DIR: /documents
      SAMPLE_DIR: /samples
      ENV_SETTINGS_FILE: /environment-settings.conf
      OUTPUT_XML: /output/captures_export.xml
      LAN_HINT: "http://192.168.68.62:8137/"
      EIP_PUBLIC_URL: "http://localhost:8136/eip/"
      EIP_HEALTH_URL: "http://pilotfish:8080/eip/"
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_USER: sa
      DB_PASSWORD: "PilotFish_Demo1!"
      DB_NAME: PilotFishDemo
      SQL_PUBLIC: "127.0.0.1:14342"
    ports:
      - "8137:8137"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./documents:/documents:ro
      - ./samples:/samples:ro
      - ./output:/output:ro
      - ./pilotfish/demo-eip-root/routes:/routes:ro
      - ./pilotfish/demo-eip-root/environment-settings.conf:/environment-settings.conf:ro
      - ./webui/static:/app/static:ro
      - ./webui/templates:/app/templates:ro
      - ./webui/app.py:/app/app.py:ro
      - ./webui/document_routes.py:/app/document_routes.py:ro
