- id: r1-smap5
  action: wait_for
  target:
    type: JMenu
    text: File
  detail: We can also see a yellow note underneath the birth date that demonstrates
    how the eiConsole's Data Mapper can be used to perform data manipulation during
    the mapping process.
  dwell_ms: 10668
  speak: /var/folders/lx/6_8c4c7d7h70v8xjmhhsl5_h0000gn/T/eiconsole-section-94_qp5za/step_29.wav
- id: r1-smap6
  action: wait_for
  target:
    type: JMenu
    text: File
  detail: Here we're formatting the date of birth value coming in from our HL7 into
    an XML date format using our date formatting tool from the palette above.
  dwell_ms: 10500
  speak: /var/folders/lx/6_8c4c7d7h70v8xjmhhsl5_h0000gn/T/eiconsole-section-94_qp5za/step_30.wav
- id: r1-smap7
  action: wait_for
  target:
    type: JMenu
    text: File
  detail: PID.7 is coming in with this format yyyyMMdd. Our desired output format
    for our XML file will be yyyy-MM-dd.
  dwell_ms: 13044
  speak: /var/folders/lx/6_8c4c7d7h70v8xjmhhsl5_h0000gn/T/eiconsole-section-94_qp5za/step_31.wav
- id: r1-smap8
  action: wait_for
  target:
    type: JMenu
    text: File
  detail: We define that using our date-time formatter so that all incoming data will
    automatically change to that format. As this mapping was created, XSLT was generated
    under the covers.
  dwell_ms: 13332
  speak: /var/folders/lx/6_8c4c7d7h70v8xjmhhsl5_h0000gn/T/eiconsole-section-94_qp5za/step_32.wav
