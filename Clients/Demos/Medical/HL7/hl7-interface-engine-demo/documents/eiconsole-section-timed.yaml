- id: r1-smap3
  action: wait_for
  target:
    type: JMenu
    text: File
  detail: Logical mapping rules are created through dragging and dropping onto the
    structure in the middle, with green nodes representing XML elements from our custom
    XML file and our blue nodes representing values mapped to those fields.
  dwell_ms: 16140
  speak: /var/folders/lx/6_8c4c7d7h70v8xjmhhsl5_h0000gn/T/eiconsole-section-94_qp5za/step_27.wav
- id: r1-smap4
  action: wait_for
  target:
