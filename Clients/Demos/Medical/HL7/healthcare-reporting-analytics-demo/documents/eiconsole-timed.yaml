    speak: /var/folders/lx/6_8c4c7d7h70v8xjmhhsl5_h0000gn/T/eiconsole-video-ump31_bw/step_11.wav
  - id: r1-lmod
    action: click
    target: { type: table, contains: "HL7 Source System" }
    detail: "The eiConsole supports real-time, periodic, scheduled and triggered listeners. Some commonly implemented listeners include HL7 over LLP, FTP including SFTP and FTPS, SOAP and RESTful based web services, and messaging middleware such as JMS, MSMQ, and RabbitMQ."
    optional: true
    dwell_ms: 25356
    speak: /var/folders/lx/6_8c4c7d7h70v8xjmhhsl5_h0000gn/T/eiconsole-video-ump31_bw/step_12.wav
  - id: r1-lproc
    action: wait_for
    target: { type: JMenu, text: File }
    detail: "After the Listeners, configured processors offer a library of widgets for manipulation and validation before data transformation. Common examples include decryption, decompression or validation. Processors, as with other stages in the assembly line, are extensible through an open Java-based API."
    dwell_ms: 22716
    speak: /var/folders/lx/6_8c4c7d7h70v8xjmhhsl5_h0000gn/T/eiconsole-video-ump31_bw/step_13.wav
