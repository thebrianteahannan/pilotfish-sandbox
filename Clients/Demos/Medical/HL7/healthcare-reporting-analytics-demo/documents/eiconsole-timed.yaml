    target: { type: table, contains: "HIE" }
    detail: "Here are several example routes that represent real-world uses of the software. Data acquisition and normalization of Health Information Exchange data. Receipt and transformation of laboratory orders, status and results. On-premise medical equipment integration, such as smart cards in a hospital that must be integrated with pharmacy, EMR and billing systems. Acquisition of clinical and administrative data for reporting and analytics. Integration of HL7-based hospital systems with cloud-based solution providers that may be using technology such as JSON, XML and web services."
