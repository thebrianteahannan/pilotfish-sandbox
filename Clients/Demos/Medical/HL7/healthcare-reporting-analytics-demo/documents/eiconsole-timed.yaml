    speak: /var/folders/lx/6_8c4c7d7h70v8xjmhhsl5_h0000gn/T/eiconsole-video-ump31_bw/step_08.wav
  - id: r1-src3
    action: wait_for
    target: { type: JMenu, text: File }
    detail: "To do this, the user configures the eiConsole Interface Assembly Line, a consistent set of stages flexible enough to connect any system to any other, regardless of data format or connectivity protocol."
