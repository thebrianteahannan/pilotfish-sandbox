    speak: /var/folders/lx/6_8c4c7d7h70v8xjmhhsl5_h0000gn/T/eiconsole-video-ump31_bw/step_10.wav
  - id: r1-listener
    action: click
    target: { type: table, contains: "RoutingSource", column: 1 }
