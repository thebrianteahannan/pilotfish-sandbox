    speak: /var/folders/lx/6_8c4c7d7h70v8xjmhhsl5_h0000gn/T/eiconsole-video-ump31_bw/step_09.wav
  - id: r1-src4
    action: wait_for
    target: { type: JMenu, text: File }
    detail: "Moving from left to right, we start with the Source system, which maintains descriptive information about the sending system."
