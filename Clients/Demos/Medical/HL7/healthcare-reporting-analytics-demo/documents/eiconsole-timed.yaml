  - id: r1-src
    action: click
    target: { type: table, contains: "RoutingSource", column: 0 }
    detail: "Here we see data coming in as HL7 over LLP. We have some claims-based EDI files being dropped in an FTP folder. We also have some FHIR JSON coming in through a RESTful web service."
    optional: true
    dwell_ms: 14628
    speak: /var/folders/lx/6_8c4c7d7h70v8xjmhhsl5_h0000gn/T/eiconsole-video-ump31_bw/step_07.wav
  - id: r1-src2
    action: wait_for
    target: { type: JMenu, text: File }
