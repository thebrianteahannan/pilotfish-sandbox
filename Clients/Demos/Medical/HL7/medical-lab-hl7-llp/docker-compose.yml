services:
  meditech-mock:
    build:
      context: ./meditech-mock
    image: pilotfish-lab-meditech-mock:latest
    container_name: pf-labllp-meditech-mock
    restart: unless-stopped
    ports:
      - "2576:2576"
    volumes:
      - ./output/meditech-received:/received

  pilotfish:
    build:
      context: ./pilotfish
    image: pilotfish-medical-lab-hl7-llp:23R1
    container_name: pf-labllp-pilotfish
    restart: unless-stopped
    depends_on:
      - meditech-mock
    environment:
      CATALINA_OPTS: "-Xms512M -Xmx2048M -server -XX:+UseG1GC"
      JAVA_OPTS: "-Djava.security.egd=file:///dev/urandom"
    ports:
      - "8098:8080"
      - "2575:2575"
    volumes:
      - ./output:/opt/pilotfish/output
      - ./logs:/usr/local/tomcat/webapps/eip/logs
      - ./samples:/opt/pilotfish/samples:ro

  webui:
    build:
      context: ./webui
    image: pilotfish-labllp-webui:latest
    container_name: pf-labllp-webui
    restart: unless-stopped
    depends_on:
      - pilotfish
    environment:
      EIP_LLP_HOST: host.docker.internal
      EIP_LLP_PORT: "2575"
      INBOUND_DIR: /output/inbound
      OUTBOUND_DIR: /output/meditech-outbound
      RECEIVED_DIR: /output/meditech-received
      SAMPLE_DIR: /samples
      ROUTES_DIR: /routes
      DOCUMENTS_DIR: /documents
      ROUTE_PDF_NAME: LabHL7LLP_V2_Route_Diagrams.pdf
      ENV_SETTINGS_FILE: /environment-settings.conf
      LAN_HINT: "http://127.0.0.1:8099/"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8099:8099"
    volumes:
      - ./output:/output
      - ./samples:/samples:ro
      - ./documents:/documents:ro
      - ./pilotfish/demo-eip-root/environment-settings.conf:/environment-settings.conf:ro
      - ./eip-root/interfaces/Medical Lab HL7 LLP/routes:/routes:ro
