#eiPlatform environment properties (FHIR R4 Platform Phase 5)

sqlserver.driver=com.microsoft.sqlserver.jdbc.SQLServerDriver
sqlserver.username=sa
sqlserver.password=PilotFish_Demo1!
sqlserver.url=jdbc\:sqlserver\://sqlserver\:1433;databaseName\=FhirR4PlatformDemo;encrypt\=true;trustServerCertificate\=true;loginTimeout\=30

FHIR_STORE_DIRECTORY=/opt/pilotfish/output/fhir-store
OUTBOUND_REQUEST_DIRECTORY=/opt/pilotfish/input/outbound
OUTBOUND_RESPONSE_DIRECTORY=/opt/pilotfish/output/outbound-responses
fhir.remote.base=https\://hapi.fhir.org/baseR4
is_debug=true

# Phase 5 OAuth / Keycloak — JWT callout route uses token introspection (not custom JAR)
fhir.oauth.jwks=http\://keycloak\:8080/realms/fhir-demo/protocol/openid-connect/certs
fhir.oauth.issuer=http\://localhost\:8112/realms/fhir-demo
fhir.oauth.introspect=http\://keycloak\:8080/realms/fhir-demo/protocol/openid-connect/token/introspect
fhir.oauth.client_id=fhir-r4-platform
fhir.oauth.client_secret=fhir-demo-secret

# Phase 6 Bulk $export (PF callout routes — no custom Bulk JAR)
fhir.public.base=http\://localhost\:8110/eip/rest/fhir
fhir.bulk.export_dir=/opt/pilotfish/output/bulk-export
