services:
  sftp:
    image: atmoz/sftp:alpine
    platform: linux/amd64
    container_name: pf-edi835-sftp
    restart: unless-stopped
    ports:
      - "2222:22"
    volumes:
      - ./sftp-seed/upload:/home/demo/upload
      # Old JSCH in PilotFish 23R1 fails modern OpenSSH defaults ("Algorithm negotiation fail")
      - ./sftp/sshd_config:/etc/ssh/sshd_config:ro
    command: demo:demo:1001:1001:upload

  floci-oci:
    image: floci/floci-oci:latest
    container_name: pf-edi835-floci
    restart: unless-stopped
    environment:
      FLOCI_OCI_HOSTNAME: floci-oci
      FLOCI_OCI_BASE_URL: http://floci-oci:4599
      FLOCI_OCI_DEFAULT_NAMESPACE: floci-local
      FLOCI_OCI_DEFAULT_REGION: us-ashburn-1
      FLOCI_OCI_STORAGE_MODE: persistent
      FLOCI_OCI_STORAGE_PERSISTENT_PATH: /data
      FLOCI_OCI_SERVICES_FUNCTIONS_MOCK: "true"
    ports:
      - "4599:4599"
    volumes:
      - ./output/floci-data:/data

  floci-init:
    build:
      context: ./floci-init
    image: pilotfish-edi835-floci-init:latest
    container_name: pf-edi835-floci-init
    depends_on:
      - floci-oci
    environment:
      OCI_ENDPOINT: http://floci-oci:4599
      OCI_NAMESPACE: floci-local
      OCI_BUCKET: edi-835-payments
      OCI_CONFIG_FILE: /oci-config/config
    volumes:
      - ./oci-config:/oci-config:ro
    restart: "no"

  pilotfish:
    build:
      context: ./pilotfish
    image: pilotfish-edi835-oci:23R1
    container_name: pf-edi835-pilotfish
    restart: unless-stopped
    depends_on:
      floci-init:
        condition: service_completed_successfully
      sftp:
        condition: service_started
    environment:
      CATALINA_OPTS: "-Xms512M -Xmx2048M -server -XX:+UseG1GC"
      JAVA_OPTS: "-Djava.security.egd=file:///dev/urandom"
    ports:
      - "8104:8080"
    volumes:
      - ./output:/opt/pilotfish/output
      - ./logs:/usr/local/tomcat/webapps/eip/logs
      - ./oci-config:/oci-config:ro

  webui:
    build:
      context: ./webui
    image: pilotfish-edi835-webui:latest
    container_name: pf-edi835-webui
    restart: unless-stopped
    depends_on:
      - sftp
      - floci-oci
      - pilotfish
    environment:
      SFTP_UPLOAD_DIR: /sftp-upload
      SFTP_HINT: "sftp:22/upload (user demo/demo, host port 2222)"
      ARCHIVE_DIR: /output/archive
      STAGED_DIR: /output/staged
      JSON_DIR: /output/json
      SAMPLE_DIR: /samples
      ROUTES_DIR: /routes
      DOCUMENTS_DIR: /documents
      ROUTE_PDF_NAME: EDI835_OCI_V2_Route_Diagrams.pdf
      GAPS_PDF_NAME: PilotFish_EDI835_OCI_Gaps_And_Custom_Modules.pdf
      ENV_SETTINGS_FILE: /environment-settings.conf
      OCI_ENDPOINT: http://floci-oci:4599
      OCI_NAMESPACE: floci-local
      OCI_BUCKET: edi-835-payments
      OCI_CONFIG_FILE: /oci-config/config
      LAN_HINT: "http://192.168.68.52:8105/"
    ports:
      - "8105:8105"
    volumes:
      - ./output:/output
      - ./samples:/samples:ro
      - ./documents:/documents:ro
      - ./sftp-seed/upload:/sftp-upload
      - ./oci-config:/oci-config:ro
      - ./pilotfish/demo-eip-root/environment-settings.conf:/environment-settings.conf:ro
      - ./eip-root/interfaces/EDI 835 OCI Bucket/routes:/routes:ro
