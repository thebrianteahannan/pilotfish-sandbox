services:
  webui:
    profiles: ["stage", "full"]
    build:
      context: ./webui
    image: pilotfish-edi-276-277-claim-status-webui:latest
    container_name: pf-edi-276-277-claim-st-webui
    restart: unless-stopped
    environment:
      WEBUI_PORT: "8127"
      ROUTES_DIR: /routes
      DOCUMENTS_DIR: /documents
      LAN_HINT: "http://192.168.68.62:8127/"
      EIP_PUBLIC_URL: "http://localhost:8126/eip/"
    ports:
      - "8127:8127"
    volumes:
      - ./documents:/documents:ro
      # Prefer demo-eip-root (no spaces). Bind mounts of ".../EDI 276 277 Claim Status/routes"
      # often appear empty inside Docker Desktop.
      - ./pilotfish/demo-eip-root/routes:/routes:ro
      - ./webui/static:/app/static:ro

  # Add pilotfish (+ deps) under profile "full" when runtime is ready.
  # pilotfish:
  #   profiles: ["full"]
  #   ...
