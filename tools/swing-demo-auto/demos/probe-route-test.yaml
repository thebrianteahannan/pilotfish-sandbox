name: probe-route-test
steps:
  - id: wait
    action: wait_for
    target: { type: JMenu, text: File }
    detail: "File Management is up."
    dwell_ms: 500
  - id: open-pkg
    action: double_click
    target: { type: table, contains: "EDI 834 CSV Excel Conversion" }
    detail: "Open package."
    dwell_ms: 2000
  - id: open-route
    action: double_click
    target: { type: table, contains: "1 - CSV TXT to EDI 834" }
    detail: "Open forward route."
    dwell_ms: 2500
  - id: listener
    action: click
    target: { type: table, contains: RoutingSource, column: 1 }
    detail: "Listener stage."
    dwell_ms: 1200
  - id: source-tx
    action: click
    target: { type: table, contains: RoutingSource, column: 2 }
    detail: "Source Transform."
    dwell_ms: 1200
  - id: target-tx
    action: click
    target: { type: table, contains: RoutingSource, column: 4 }
    detail: "Target Transform."
    dwell_ms: 1200
  - id: transport
    action: click
    target: { type: table, contains: RoutingSource, column: 5 }
    detail: "Transport."
    dwell_ms: 1200
  - id: mode
    action: click
    target: { type: JMenu, text: Mode }
    detail: "Mode menu."
    dwell_ms: 400
  - id: testing
    action: click
    target: { type: menuitem, contains: Testing }
    detail: "Testing Mode."
    dwell_ms: 2000
